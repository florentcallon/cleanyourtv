name: Build launcher APK

# Builds the launcher from this fork's own source and attaches the APK to a GitHub release named
# after the commit, so a Windows PC without Android Studio can download it and install it over ADB.
# The release build is signed with the debug key (see launcher/app/build.gradle): sideload only.

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          short=$(git rev-parse --short=10 HEAD)
          tag="launcher-$short"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt
          badging=$("$aapt" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion)")
          echo "$badging"
          printf 'Launcher built from %s\n\nsha256: %s\n\n```\n%s\n```\n' "$GITHUB_SHA" "$sha" "$badging" > notes.md
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$apk#app-release.apk" --target "$GITHUB_SHA" --title "Launcher $short" --notes-file notes.md
